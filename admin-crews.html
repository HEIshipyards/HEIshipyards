<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEI · Crews of the Almagest Editor</title><style>
:root{color-scheme:dark;--bg:#121b22;--panel:#202d36;--line:#445866;--orange:#d97d35;--text:#e9eef0;--muted:#a9b8c1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:22px max(18px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#1b2832}
h1{font-size:21px;margin:0;letter-spacing:.08em}h1 span,.eyebrow{color:var(--orange)}a{color:#e4af7c}
main{max-width:1200px;margin:30px auto;padding:0 18px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{margin:0 0 18px;font-size:19px}label{display:block;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;font:inherit;border:1px solid #586c77;background:#131e25;border-radius:6px;color:var(--text);padding:10px}
textarea{min-height:140px;resize:vertical}button{cursor:pointer;font:inherit;border:1px solid var(--line);background:#354751;color:white;border-radius:6px;padding:10px 12px}
button:hover{border-color:var(--orange)}button.primary{background:var(--orange);border-color:var(--orange);color:#161b20;font-weight:750}
button:disabled{opacity:.45;cursor:not-allowed}
#vesselList{display:grid;gap:5px;max-height:66vh;overflow:auto}
#vesselList button{text-align:left}#vesselList button.active{border-color:var(--orange);background:#3c3a31}
.cover{max-width:480px;width:100%;height:230px;object-fit:contain;background:#101920;border:1px solid var(--line);border-radius:8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.photo{background:#111c23;border:1px solid var(--line);padding:8px;border-radius:7px;min-width:0}.photo img{width:100%;height:115px;object-fit:contain}.photo-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.photo-actions button{padding:5px 9px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.note,#status{color:var(--muted)}#status{min-height:1.6em;white-space:pre-wrap}.danger{color:#ffc6bc}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
@media(max-width:800px){.layout{grid-template-columns:1fr}#vesselList{max-height:190px}header{padding:16px}}
.ship-edit{border:1px solid var(--line);border-radius:8px;margin:16px 0;padding:12px 15px;background:#17242d}
.ship-edit>summary{font-size:18px;font-weight:700;cursor:pointer;padding:6px 0;color:#e7c0a0}
.ship-edit[open]>summary{padding-bottom:12px;border-bottom:1px solid var(--line)}
.edit-pair{border:1px solid #495b65;background:#202f39;border-radius:7px;padding:12px;margin-top:12px}
.edit-pair .pair-grid{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,2fr);gap:10px;align-items:start}
.edit-pair label{margin:0}
.edit-pair input,.edit-pair textarea{margin-top:4px}
.edit-pair textarea{min-height:76px}
.edit-pair .remove-line{margin-top:8px;padding:5px 10px}
.lore-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}.lore-toolbar button{padding:5px 10px;min-width:36px}.lore-document{background:#131e25;border:1px solid #586c77;border-radius:6px;min-height:350px;max-height:680px;overflow:auto;padding:18px;outline-offset:3px;line-height:1.65}.lore-document:focus{outline:2px solid var(--orange)}.lore-document h2,.lore-document h3{margin:1em 0 .4em}.lore-document p{margin:.5em 0}.lore-document ul{padding-left:25px}.lore-document:empty:before{content:"Write the vessel's history here…";color:var(--muted)}
#shipStatus{white-space:pre-wrap;min-height:1.4em}
@media(max-width:550px){.edit-pair .pair-grid{grid-template-columns:1fr}}
</style></head>
<body><header><div><div class="eyebrow">HELIX ENGINEERING &amp; INTEGRATION</div><h1>HEI <span>WEBSITE EDITOR</span></h1></div><a href="/">View public website ↗</a></header>
<main><p class="note">Choose a website section using the navigation below. Each section has its own editing workspace and publishing controls.</p></main>
<script defer src="/assets/admin-content-editor.js"></script></body></html>
