name: Sync Steam Workshop

# Legacy manual-only recovery workflow. V2 owns the daily schedule.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run Excalibur-only screenshot test or full sync"
        required: true
        default: "excalibur-test"
        type: choice
        options:
          - excalibur-test
          - full-sync

permissions:
  contents: write

concurrency:
  group: workshop-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific scheduling window
        id: pacific
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=America/Los_Angeles date +%H)" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside 8 AM Pacific; skipping duplicate UTC scheduled run."
          fi

      - uses: actions/checkout@v4
        if: steps.pacific.outputs.should_run == 'true'
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.pacific.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Test Excalibur screenshots only (read-only)
        if: steps.pacific.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'excalibur-test'
        run: python scripts/test_excalibur_gallery.py

      - name: Fetch Steam Workshop listings
        if: steps.pacific.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'full-sync')
        run: python scripts/sync_workshop.py

      - name: Commit only if data changed
        if: steps.pacific.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'full-sync')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workshop.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Steam Workshop fleet data"
            git push
          fi
