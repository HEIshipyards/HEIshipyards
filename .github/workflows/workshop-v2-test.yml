name: HEI Fleet Registry Validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_workshop_v2.py'
      - 'tests/test_sync_v2.py'
      - '.github/workflows/workshop-v2-test.yml'
      - 'data/workshop-v2.json'
  pull_request:
    paths:
      - 'scripts/sync_workshop_v2.py'
      - 'tests/test_sync_v2.py'
      - '.github/workflows/workshop-v2-test.yml'
      - 'data/workshop-v2.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline registry regression tests
        run: python -m unittest discover -s tests -p 'test_sync_v2.py' -v
      - name: Audit existing image files
        run: python scripts/audit_workshop_images.py
      - name: Validate fleet registry JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('data/workshop-v2.json').read_text())
          assert isinstance(items, list) and len(items) >= 1
          ids = [str(v['id']) for v in items]
          assert len(ids) == len(set(ids)), 'Duplicate Workshop IDs'
          print(f'Validated {len(ids)} manual fleet entries. No Steam requests made.')
          PY
